name: pages

# Deploys site/ to GitHub Pages. Enable once in repo Settings -> Pages ->
# Source: "GitHub Actions". Data commits from the sync workflow carry
# [skip ci] and do NOT redeploy - the page reads fresh data.json straight
# from raw.githubusercontent.com, so redeploys only happen when the app
# itself changes.
on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gowild-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
