name: pages

# Builds site/data.json fresh, then deploys site/ to GitHub Pages.
# Enable once in repo Settings -> Pages -> Source: "GitHub Actions".
#
# data.json is generated here at deploy time (NOT committed to git) so it can
# never be corrupted by a branch merge. On a normal push the build uses seed
# data only (no paid API calls); on a manual "Run workflow" / the dashboard
# Sync button (workflow_dispatch), it runs a full live sync with your secrets.
on:
  workflow_dispatch:
  push:
    paths:
      - 'site/**'
      - 'src/**'
      - 'scripts/**'
      - 'trip.config.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gowild-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # LIVE build: only on manual Sync / Run workflow, so routine code pushes
      # never burn paid API quota. Secrets are passed here and nowhere else.
      - name: Build data (live sync)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node src/cli.js sync || echo "sync had issues; export falls back to seed for those sections"
          node scripts/export-pages-data.js
        env:
          BUILD_MODE: live
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      # SEED build: code pushes just rebuild the page from seed data - no API
      # calls, no quota. The page says so and points at the Sync button.
      - name: Build data (seed only)
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/export-pages-data.js
        env:
          BUILD_MODE: seed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
